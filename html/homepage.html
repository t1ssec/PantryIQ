<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/homepage.css">
    <script src="/js/homepage.js" defer></script>
    <title>PantryIQ</title>
</head>
<body>
    <div class="navbar">
        <a href="/"><img src="/assets/logo/logo.png" id="logo">PantryIQ</a>
        <div class="centerme">
            <a class="active" href="/">By Ingredients</a>
            <a href="">Favorites</a>
        </div>
    </div >
    <div class="mainContent">
        <div class="otherMainContent">
            <div class="row">
                <div class="InputSection">
                    <a>1. Input Section</a>
                    <input type="text" id="firstinputsection" placeholder="Enter ingredients:">
                </div>
                <div class="RecipeSection">
                    <a>2. Recipe Cards</a>
                    <div class="reciperesults">
                        <p class="info">Try searching for something</p>
                    </div>
                </div>
            </div>
            
            <div class="ShoppingSection">
                <a>3. SHOPPING LIST</a>
                <a>Missing items auto-added here:</a>
                <div class="MissingShoppingList">
                    <p class="info">Try choosing a recipe first.</p>
                    <!--<div class="shoppingitem">
                        <input type="checkbox">
                        <a>200g Mozarella Cheese</a>
                    </div>-->
                </div>
                <a>Matching items:</a>
                <div class="MatchingShoppingList">
                    <p class="info">Try choosing a recipe first.</p>
                    <!--<div class="shoppingitem">
                        <input type="checkbox">
                        <a>200g Mozarella Cheese</a>
                    </div>-->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
