<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link id="theme-stylesheet" rel="stylesheet" href="/css/dark-theme.css">
    <script src="/js/theme.js" defer></script>
    <title>Homepage - PantryIQ</title>
</head>

<body>
    <!-- TOP BAR ---------------------------------------------------------------------------------------------->
    <div class="navbar">
        <a href="/"><img src="/favicon.ico" id="logo">PantryIQ</a>
        <div class="centerme">
            <a href="/byIngredients">By Ingredients</a>
            <a href="/searchrecipes">Search Recipes</a>
            <a href="/favorites">Favorites</a>
        </div>
        <div class="theme-switcher" role="group" aria-label="Color theme">
            <button class="theme-btn light-btn" type="button" data-theme="light">Light</button>
            <button class="theme-btn dark-btn active" type="button" data-theme="dark" aria-current="true">Dark</button>
        </div>
    </div>

    <div class="mainContent">
        <div class="otherMainContent">

            <h1>Welcome to PantryIQ</h1>
            <pre
                style="margin-bottom: 50px;">Search for recipes and find what to cook <br> based on the ingredients you already have.</pre>

            <div style="display: flex; flex-direction: column; width: 20%; margin: 0 auto;">
                <button onclick="window.open('/byIngredients', '_self')">Start
                    using</button><br>
                <button onclick=" window.open('https://github.com/t1ssec/PantryIQ', '_blank' )">View on Github</button>
            </div>
        </div>
    </div>
</body>

</html>
